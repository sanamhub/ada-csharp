name: release

# Builds all six native libraries, packs, verifies the package by consuming it, and publishes.
#
# Nothing here trusts a previous run. The natives are rebuilt from the pinned upstream tag, the
# checksums are verified against the committed manifest, and the package is consumed from a
# clean project before it is pushed anywhere.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build, verify and attach artifacts without publishing to NuGet'
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  preflight:
    # Seconds, and it runs first. Everything it checks used to be discovered either after twenty
    # minutes of native builds or, worse, in the publish job after a human had already approved
    # the deployment. A release that fails should fail before it costs anyone anything.
    name: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: the tag, the project version and the changelog must agree
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"

          project="$(grep -oPm1 '(?<=<Version>)[^<]+' src/Ada.Url/Ada.Url.csproj)"
          if [ "$tag" != "$project" ]; then
            echo "::error::tag says $tag, Ada.Url.csproj says $project. Pushing this tag would publish the wrong version."
            exit 1
          fi
          echo "tag and project version agree: $tag"

          ./scripts/changelog-section.sh "$tag" > /dev/null
          echo "CHANGELOG.md has a section for $tag"

  natives:
    # All six. A release is the one place that cannot skip a RID to save runner time.
    needs: preflight
    uses: ./.github/workflows/native.yml
    secrets: inherit

  verify:
    name: verify (${{ matrix.name }})
    needs: natives
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,      os: ubuntu-24.04,     rid: linux-x64,      container: '' }
          - { name: linux-arm64,    os: ubuntu-24.04-arm, rid: linux-arm64,    container: '' }
          - { name: win-x64,        os: windows-2022,     rid: win-x64,        container: '' }
          - { name: osx-arm64,      os: macos-14,         rid: osx-arm64,      container: '' }
          # A glibc .so will not load on Alpine, so this leg is what proves the musl RID is real
          # rather than assumed. AC-2.5.
          - { name: linux-musl-x64, os: ubuntu-24.04,     rid: linux-musl-x64, container: 'mcr.microsoft.com/dotnet/sdk:10.0-alpine' }
          #
          # osx-x64 is deliberately absent. Running an x86_64 binary needs an Intel host, and
          # macos-13 has queued 20 to 40 minutes on every attempt, blocking everything behind it
          # because `needs` is job level. A release that cannot start for 40 minutes is a release
          # nobody cuts. The native build still checks its architecture with lipo so an arm64
          # binary cannot ship under that RID, and nightly.yml runs the full consumption test on
          # macos-13 where a long queue costs nothing.
    steps:
      - uses: actions/checkout@v7

      - name: alpine prerequisites
        if: matrix.container != ''
        run: apk add --no-cache bash python3
        shell: sh

      - uses: actions/setup-dotnet@v6
        if: matrix.container == ''
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: artifacts/native
      - name: flatten the artifact layout
        shell: bash
        run: |
          cd artifacts/native
          for d in native-*; do
            [ -d "$d" ] || continue
            mv "$d" "${d#native-}"
          done
          ls -R . | head -40 || true

      # The gate is active here: a release package missing any RID fails to pack.
      - name: pack
        shell: bash
        run: dotnet pack src/Ada.Url/Ada.Url.csproj -c Release -o out

      - name: consume the package
        shell: bash
        run: ./tests/packaging/verify-package.sh --package-dir out --rid ${{ matrix.rid }}

      - uses: actions/upload-artifact@v7
        if: matrix.rid == 'linux-x64'
        with:
          name: nupkg
          path: |
            out/*.nupkg
            out/*.snupkg
          retention-days: 30

  publish:
    needs: verify
    runs-on: windows-2022          # code signing
    environment: production        # manual approval gate
    permissions:
      contents: write              # create the GitHub release
      id-token: write              # NuGet trusted publishing, so there is no long lived key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: artifacts/native
      - uses: actions/download-artifact@v7
        with:
          name: checksums
          path: manifest

      - name: verify checksums against the committed manifest
        shell: bash
        # Absolute paths throughout. An earlier version cd'd around and then referenced the
        # downloaded manifest relatively, which resolved to a path that does not exist, so a
        # missing file reported itself as a checksum mismatch.
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          committed="$root/native/CHECKSUMS.txt"
          produced="$root/manifest/CHECKSUMS.txt"

          # download-artifact nests each artifact under its own name.
          ( cd "$root/artifacts/native" && for d in native-*; do [ -d "$d" ] && mv "$d" "${d#native-}"; done )

          for f in "$committed" "$produced"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing $f. A release cannot verify what it is about to ship."
              exit 1
            fi
          done

          echo "committed:"; cat "$committed"
          echo "produced by this run:"; cat "$produced"

          # A native binary that changed between the build and the pack breaks the release here
          # rather than shipping.
          if ! diff <(sort "$committed") <(sort "$produced"); then
            echo "::error::native checksums do not match the committed manifest"
            exit 1
          fi
          echo "checksums match"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: pack
        run: dotnet pack src/Ada.Url/Ada.Url.csproj -c Release -o out

      # CycloneDX reads project.assets.json, so it sees NuGet packages and nothing else. The
      # native library this package actually ships would be missing, which is the one dependency
      # a consumer most needs listed: delivered as a binary they cannot inspect, and the one
      # whose advisories would apply to them.
      - name: sbom
        shell: pwsh
        run: |
          dotnet tool install -g CycloneDX
          dotnet CycloneDX src/Ada.Url/Ada.Url.csproj -o sbom
          python scripts/add-native-to-sbom.py sbom/bom.xml native/CHECKSUMS.txt

      - name: check the sbom lists the native
        shell: bash
        run: |
          if ! grep -q 'pkg:github/ada-url/ada' sbom/bom.xml; then
            echo "::error::SBOM does not list the native library"
            exit 1
          fi
          echo "SBOM lists the native"

      # TODO: signing needs a certificate in the production environment. Until one exists this
      # step is skipped rather than faked, because an unsigned package that claims to be signed
      # is worse than one that does not claim it.
      - name: sign
        if: vars.CODE_SIGNING_ENABLED == 'true'
        run: scripts/sign.ps1 -Dir out
        shell: pwsh

      # Trusted publishing. nuget.org validates a short lived GitHub OIDC token against a
      # policy registered for this repository and workflow, and returns a temporary API key.
      # No long lived secret exists to leak or rotate.
      #
      # The key lives for one hour and each token buys exactly one key, so this step sits
      # immediately before the push rather than at the top of the job.
      #
      # Requires a policy at nuget.org under Account, Trusted Publishing:
      #   Repository Owner: sanamhub
      #   Repository:       ada-csharp
      #   Workflow File:    release.yml
      #   Environment:      production
      - name: exchange the OIDC token for a temporary api key
        id: nuget-login
        if: github.event_name == 'push' || inputs.dry-run == false
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The path is resolved here rather than handed to dotnet as a glob. `dotnet nuget push
      # "out/*.nupkg"` failed with "File does not exist (out/*.nupkg)" on the Windows runner in
      # the step immediately after pack reported writing out\Ada.Url.0.1.0-beta.1.nupkg. A
      # relative pattern with forward slashes does not resolve there, and the failure lands after
      # the deployment approval, which is the worst place to discover anything.
      #
      # Resolving it also lets the job assert there is exactly one package to push instead of
      # silently pushing whatever happens to match.
      - name: publish to nuget.org
        if: github.event_name == 'push' || inputs.dry-run == false
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'out'
          $packages = @(Get-ChildItem -Path $out -Filter '*.nupkg' -File)

          if ($packages.Count -ne 1) {
              Get-ChildItem -Path $out -File | ForEach-Object { Write-Host "  $($_.Name)" }
              throw "expected exactly one .nupkg in out, found $($packages.Count)"
          }

          $package = $packages[0]
          Write-Host "pushing $($package.Name) ($([math]::Round($package.Length / 1MB, 2)) MB)"

          # The matching .snupkg beside it goes up automatically as the symbols package, so it
          # must not be pushed again by hand.
          dotnet nuget push $package.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push failed with exit code $LASTEXITCODE" }

      # Verifying the published package does not happen here.
      #
      # It used to, with a three minute retry budget, on the assumption that indexing lags a push
      # by a minute or two. nuget.org actually validates and indexes a new package before anything
      # can restore it, and documents that as taking up to an hour. So the check failed, the job
      # failed, and the release creation below was skipped, for a package that had published
      # perfectly well and worked as soon as validation finished.
      #
      # Holding a runner idle for an hour to find that out is the wrong trade, and it would delay
      # the release page by the same hour. The verify-published workflow does it instead: it fires
      # on the release being published, waits for indexing properly, and installs the package on
      # five platforms rather than on this one.

      # Notes come from CHANGELOG.md, not from the commit log. generate_release_notes would list
      # every commit since the previous tag, which on a first release means the entire history:
      # thirty lines of "fix:" that describe how the work happened rather than what shipped.
      - name: build the release notes
        id: notes
        # Tag pushes only. On a workflow_dispatch the ref name is a branch, and looking up a
        # changelog section for "main" would fail the job after everything else succeeded.
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          {
            ./scripts/changelog-section.sh "$version"
            echo
            echo "### Install"
            echo
            echo '```'
            echo "dotnet add package Ada.Url --version $version"
            echo '```'
            echo
            echo "### Verification"
            echo
            echo "- Attached: the package, its symbols, and a CycloneDX SBOM listing the native library."
            echo "- The six native binaries are built from the pinned Ada tag in CI and their SHA-256"
            echo "  checksums are matched against \`native/CHECKSUMS.txt\` before the package is pushed."
            echo "- Published with NuGet trusted publishing, so no long lived API key exists for this repository."
            echo
            echo "[Full changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)"
          } > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'push'
        with:
          body_path: release-notes.md
          # Beta and rc tags land as prereleases rather than as the headline version.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            out/*.nupkg
            out/*.snupkg
            sbom/*

  # Runs after the release exists, so a slow nuget.org cannot delay or block it. Called rather
  # than triggered: a release created with GITHUB_TOKEN does not fire the release event.
  verify-published:
    needs: publish
    if: github.event_name == 'push'
    uses: ./.github/workflows/verify-published.yml
    with:
      version: ${{ github.ref_name }}
