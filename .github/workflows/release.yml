name: release

# Builds all six native libraries, packs, verifies the package by consuming it, and publishes.
#
# Nothing here trusts a previous run. The natives are rebuilt from the pinned upstream tag, the
# checksums are verified against the committed manifest, and the package is consumed from a
# clean project before it is pushed anywhere.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build, verify and attach artifacts without publishing to NuGet'
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  natives:
    # All six. A release is the one place that cannot skip a RID to save runner time.
    uses: ./.github/workflows/native.yml
    secrets: inherit

  verify:
    name: verify (${{ matrix.name }})
    needs: natives
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,      os: ubuntu-24.04,     rid: linux-x64,      container: '' }
          - { name: linux-arm64,    os: ubuntu-24.04-arm, rid: linux-arm64,    container: '' }
          - { name: win-x64,        os: windows-2022,     rid: win-x64,        container: '' }
          - { name: osx-arm64,      os: macos-14,         rid: osx-arm64,      container: '' }
          # osx-x64 is deliberately absent. Running an x86_64 binary needs an Intel host, and
          # macos-13 has queued for 20 to 40 minutes on every attempt, blocking everything
          # behind it because `needs` is job level. A release that cannot start for 40 minutes
          # is a release nobody cuts.
          #
          # What still covers that RID: the native build checks the architecture with lipo, so
          # a silently arm64 binary cannot ship under it, and nightly.yml runs the full
          # consumption test on macos-13 where a long queue costs nothing.
          # A glibc .so will not load on Alpine, so this leg is what proves the musl RID is real
          # rather than assumed. AC-2.5.
          - { name: linux-musl-x64, os: ubuntu-24.04,     rid: linux-musl-x64, container: 'mcr.microsoft.com/dotnet/sdk:10.0-alpine' }
    steps:
      - uses: actions/checkout@v7

      - name: alpine prerequisites
        if: matrix.container != ''
        run: apk add --no-cache bash python3
        shell: sh

      - uses: actions/setup-dotnet@v6
        if: matrix.container == ''
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: artifacts/native
      - name: flatten the artifact layout
        shell: bash
        run: |
          cd artifacts/native
          for d in native-*; do
            [ -d "$d" ] || continue
            mv "$d" "${d#native-}"
          done
          ls -R . | head -40

      # The gate is active here: a release package missing any RID fails to pack.
      - name: pack
        shell: bash
        run: dotnet pack src/Ada.Url/Ada.Url.csproj -c Release -o out

      - name: consume the package
        shell: bash
        run: ./tests/packaging/verify-package.sh --package-dir out --rid ${{ matrix.rid }}

      - uses: actions/upload-artifact@v7
        if: matrix.rid == 'linux-x64'
        with:
          name: nupkg
          path: |
            out/*.nupkg
            out/*.snupkg
          retention-days: 30

  publish:
    needs: verify
    runs-on: windows-2022          # code signing
    environment: production        # manual approval gate
    permissions:
      contents: write              # create the GitHub release
      id-token: write              # NuGet trusted publishing, so there is no long lived key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: artifacts/native
      - uses: actions/download-artifact@v7
        with:
          name: checksums
          path: manifest

      - name: verify checksums against the committed manifest
        shell: bash
        # Absolute paths throughout. An earlier version cd'd around and then referenced the
        # downloaded manifest relatively, which resolved to a path that does not exist, so a
        # missing file reported itself as a checksum mismatch.
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          committed="$root/native/CHECKSUMS.txt"
          produced="$root/manifest/CHECKSUMS.txt"

          # download-artifact nests each artifact under its own name.
          ( cd "$root/artifacts/native" && for d in native-*; do [ -d "$d" ] && mv "$d" "${d#native-}"; done )

          for f in "$committed" "$produced"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing $f. A release cannot verify what it is about to ship."
              exit 1
            fi
          done

          echo "committed:"; cat "$committed"
          echo "produced by this run:"; cat "$produced"

          # A native binary that changed between the build and the pack breaks the release here
          # rather than shipping.
          if ! diff <(sort "$committed") <(sort "$produced"); then
            echo "::error::native checksums do not match the committed manifest"
            exit 1
          fi
          echo "checksums match"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: pack
        run: dotnet pack src/Ada.Url/Ada.Url.csproj -c Release -o out

      - name: sbom
        run: |
          dotnet tool install -g CycloneDX
          dotnet CycloneDX src/Ada.Url/Ada.Url.csproj -o sbom
        shell: pwsh

      # TODO: signing needs a certificate in the production environment. Until one exists this
      # step is skipped rather than faked, because an unsigned package that claims to be signed
      # is worse than one that does not claim it.
      - name: sign
        if: vars.CODE_SIGNING_ENABLED == 'true'
        run: scripts/sign.ps1 -Dir out
        shell: pwsh

      # Trusted publishing. nuget.org validates a short lived GitHub OIDC token against a
      # policy registered for this repository and workflow, and returns a temporary API key.
      # No long lived secret exists to leak or rotate.
      #
      # The key lives for one hour and each token buys exactly one key, so this step sits
      # immediately before the push rather than at the top of the job.
      #
      # Requires a policy at nuget.org under Account, Trusted Publishing:
      #   Repository Owner: sanamhub
      #   Repository:       ada-csharp
      #   Workflow File:    release.yml
      #   Environment:      production
      - name: exchange the OIDC token for a temporary api key
        id: nuget-login
        if: github.event_name == 'push' || inputs.dry-run == false
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: publish to nuget.org
        if: github.event_name == 'push' || inputs.dry-run == false
        run: >
          dotnet nuget push "out/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          files: |
            out/*.nupkg
            out/*.snupkg
            sbom/*
          generate_release_notes: true
