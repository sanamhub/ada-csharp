name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs opt into more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CI: 'true'

jobs:
  natives:
    # Only the RIDs build-test actually runs on. macos-13 can sit queued for tens of minutes,
    # and because `needs` is job level one stuck matrix leg blocks the whole run. osx-x64 and
    # linux-musl-x64 are built by the release workflow and by the packaging job, neither of
    # which gates a pull request.
    uses: ./.github/workflows/native.yml
    with:
      rids: >-
        [{"rid":"win-x64","os":"windows-2022"},
         {"rid":"linux-x64","os":"ubuntu-24.04"},
         {"rid":"linux-arm64","os":"ubuntu-24.04-arm"},
         {"rid":"osx-arm64","os":"macos-14"}]

  build-test:
    name: build+test (${{ matrix.rid }})
    needs: natives
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022,     rid: win-x64     }
          - { os: ubuntu-24.04,     rid: linux-x64   }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-14,         rid: osx-arm64   }
    steps:
      # TODO(P1): pin third-party actions by full commit SHA (org section 7 supply chain).
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: download native
        uses: actions/download-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}

      - name: restore
        run: dotnet restore

      # TreatWarningsAsErrors + AnalysisLevel=latest-all makes this the lint gate too.
      - name: build
        run: dotnet build -c Release --no-restore

      - name: test
        run: >
          dotnet test -c Release --no-build
          --filter "Category!=Stress"
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      # AC-1.2: zero conditional compilation in the repository (single TFM, ADR-0001).
      - name: assert no conditional compilation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if grep -rn --include='*.cs' -E '^\s*#(if|else|elif|endif)\b' src tests; then
            echo "::error::#if found. ADR-0001 requires zero conditional compilation."
            exit 1
          fi

      # The report is generated by a test rather than maintained by hand, so it cannot drift
      # away from what the parsers actually do. Only collected once, since it is identical on
      # every platform.
      - name: collect the System.Uri difference report
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          found="$(find tests -name system-uri-differences.md -path '*/bin/*' | head -1)"
          if [ -n "$found" ]; then
            cp "$found" docs/system-uri-differences.md
            echo "### System.Uri differences" >> "$GITHUB_STEP_SUMMARY"
            head -22 docs/system-uri-differences.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::difference report was not produced"
          fi

      - name: upload the difference report
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: system-uri-differences
          path: docs/system-uri-differences.md
          retention-days: 30

      - name: upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}
          path: TestResults
          retention-days: 7

  packaging:
    # Consumes the built package from a clean project with no reference to this source tree.
    #
    # This is the job that catches a package which builds, tests, and installs cleanly and then
    # throws DllNotFoundException on the consumer's first call. That exact bug shipped once.
    needs: natives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: artifacts/native
      - name: flatten the artifact layout
        run: |
          cd artifacts/native
          for d in native-*; do
            [ -d "$d" ] || continue
            mv "$d" "${d#native-}"
          done
          ls -R .

      # AllowPartialNativePack is set here on purpose. A pull request builds four RIDs, so the
      # package is deliberately incomplete and this job is testing consumption rather than
      # release readiness. The release workflow packs all six with the gate active.
      - name: pack
        run: dotnet pack src/Ada.Url/Ada.Url.csproj -c Release -o out -p:AllowPartialNativePack=true

      - name: consume the package
        run: ./tests/packaging/verify-package.sh --package-dir out --rid linux-x64

      - name: consume it under NativeAOT
        run: |
          sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          ./tests/packaging/verify-package.sh --package-dir out --rid linux-x64 --aot

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: out/*.nupkg
          retention-days: 7

  analyze:
    name: codeql
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
      - run: dotnet build -c Release
      - uses: github/codeql-action/analyze@v4

  deps:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      # Blocks a merge on a critical or high advisory without a recorded risk decision.
      #
      # continue-on-error until the action is confirmed working on this repo. It failed on all
      # four Dependabot PRs with a null title and a null summary, which is the shape of the
      # action erroring rather than reporting a finding. It needs the repository Dependency
      # graph enabled to call the dependency-graph compare API. Once a run produces a real
      # report, drop continue-on-error and add this job back to branch protection.
      - uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
