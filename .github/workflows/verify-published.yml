name: verify published

# Installs the package from nuget.org on every platform it claims to support, after it is public.
#
# The release workflow already does this once, but inside the publish job, which runs on Windows
# because code signing needs signtool. One platform is thin cover for a library whose whole
# problem is shipping eight native binaries, and win-x64 is the least likely of them to fail.
#
# Called by release.yml rather than triggered by the release event.
#
# The obvious wiring, `on: release: types: [published]`, never fires here. A release created by a
# workflow using GITHUB_TOKEN does not trigger new workflow runs, which is GitHub's guard against
# a workflow setting itself off in a loop. The trigger looked right, the release was created, and
# nothing ran.
#
# workflow_call keeps this in its own file, so it stays readable and separately dispatchable,
# while release.yml decides when it happens.

on:
  workflow_call:
    inputs:
      version:
        description: 'Package version to verify, without the leading v'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to verify, without the leading v'
        type: string
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,      os: ubuntu-24.04,     container: '' }
          - { name: linux-arm64,    os: ubuntu-24.04-arm, container: '' }
          - { name: osx-arm64,      os: macos-14,         container: '' }
          - { name: win-x64,        os: windows-2022,     container: '' }
          - { name: win-arm64,      os: windows-11-arm,   container: '' }
          - { name: linux-musl-x64, os: ubuntu-24.04,     container: 'mcr.microsoft.com/dotnet/sdk:10.0-alpine' }
          - { name: linux-musl-arm64, os: ubuntu-24.04-arm, container: '', alpine: 'mcr.microsoft.com/dotnet/sdk:10.0-alpine' }
          # osx-x64 needs an Intel host, and macos-13 queues for tens of minutes. nightly.yml
          # covers it, where waiting costs nothing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: alpine prerequisites
        if: matrix.container != ''
        shell: sh
        run: apk add --no-cache bash curl

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.container == ''
        with:
          global-json-file: global.json

      - name: verify the published package
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          version="${version#v}"
          echo "verifying Ada.Url $version from nuget.org"
          # nuget.org documents validation and indexing as taking up to an hour, and this workflow
          # fires the moment the release is created, so waiting is the expected path.
          ./tests/packaging/verify-published.sh --version "$version" --wait-minutes 75

      # GitHub runs JavaScript actions inside an Alpine container on x64 runners only, so the
      # arm64 musl leg cannot use `container:`. It stays on the host and runs this one step in
      # Alpine instead, which is the part that has to happen on musl.
      - name: verify the published package in Alpine
        if: ${{ matrix.alpine }}
        shell: bash
        run: |
          version="${{ inputs.version }}"
          docker run --rm -e DOTNET_NOLOGO -e DOTNET_CLI_TELEMETRY_OPTOUT -v "$PWD:/w" -w /w '${{ matrix.alpine }}' \
            sh -c "apk add --no-cache bash curl && ./tests/packaging/verify-published.sh --version '${version#v}' --wait-minutes 75"
