name: win-toolset-probe

# Prints how the in-box ClangCL toolset picks its linker. Nothing else.
#
# Two attempts to move the clang-cl variant off lld-link have failed, #26 and #27. The first set
# the property through CMAKE_VS_GLOBALS, which LLVM.Cpp.Common.props overwrites because it
# assigns UseLldLink with no condition. The second passed it as an MSBuild global property, which
# a PropertyGroup cannot override, and lld-link still linked. So the in-box toolset that ships
# with Visual Studio 2022 is not the one whose sources are public, and guessing a third time
# costs another two hour run.
#
# One minute of CI to read the actual files instead. Delete once #19 is closed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: read the ClangCL toolset
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: find and print the toolset files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsRoot = & $vswhere -latest -products '*' -property installationPath
          Write-Output "VS root: $vsRoot"

          $files = @(Get-ChildItem -Path $vsRoot -Recurse -File -ErrorAction SilentlyContinue `
                     -Include '*.props', '*.targets' |
                     Where-Object { $_.FullName -match 'ClangCL|LLVM' })

          Write-Output "found $($files.Count) candidate toolset files:"
          $files | ForEach-Object { "  $($_.FullName)" }

          # The three properties that decide which linker runs.
          foreach ($f in $files) {
              $hits = Select-String -Path $f.FullName -Pattern 'UseLldLink|LinkToolExe|LinkToolPath|lld-link'
              if ($hits) {
                  Write-Output ''
                  Write-Output "=== $($f.FullName)"
                  $hits | ForEach-Object { "  line $($_.LineNumber): $($_.Line.Trim())" }
              }
          }

          # Whether link.exe is even reachable, since pointing LinkToolExe at it needs a path.
          $link = Get-ChildItem -Path (Join-Path $vsRoot 'VC/Tools/MSVC') -Filter 'link.exe' -Recurse -File -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match 'Hostx64\\x64' } |
                  Select-Object -First 1
          Write-Output ''
          Write-Output "link.exe: $(if ($link) { $link.FullName } else { 'not found' })"
