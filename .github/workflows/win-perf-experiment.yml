name: win-perf-experiment

# Not part of CI, and not a gate. Answers #18: does whole program optimisation behind a generated
# .def buy anything on Windows.
#
# One runner per measurement. Comparing a number from one runner against a number from another
# runner would measure the runners. Everything measured here runs on the same machine in the same
# session, which is the only reason the comparison means anything.
#
# Each variant is built once, then the benchmark runs the variants in rotation, repeat by repeat.
# The first run put every measurement of a variant next to every other measurement of the same
# variant, and the runner drifted 7 percent between the first and the second, which is larger
# than the effect being measured. Rotating spreads that drift across all of them instead of
# handing it to one.
#
# Kept after #18 closed so the comparison can be rerun when the pinned ada tag moves, which is the
# same reason ADR-0006 kept the all-symbols path in native/build-windows.ps1. The clang-cl
# variants are gone with #19: that question turned out to be the heap rather than the compiler,
# and ADR-0007 has the measurement.
#
# Two things changed for #45.
#
# Variant c is a pure /GL comparison. Variant a differs from b in two ways at once, exports and
# /GL, so it can say the pair is worth 7 percent but not which half. c holds the export list fixed
# and moves only /GL, which is the question #45 asks: what does turning it off actually cost.
#
# win-arm64 can be measured at all. /GL is the reason both Windows RIDs track the runner image,
# and the case for turning it off on arm64 rests on nothing having measured it there. That is an
# absence of evidence, not a zero, so this measures it. arm64 cannot run its own build, because
# the DLL cross compiles from an x64 host, so the build and the measurement are separate jobs and
# conformance moves to the machine the binary is actually for.

on:
  workflow_dispatch:
    inputs:
      rid:
        description: 'Which Windows RID to measure'
        type: choice
        options: [win-x64, win-arm64]
        default: win-x64
      categories:
        description: >
          Comma separated benchmark categories. W1 is a plain URL, W2 a hard one, W4 the parse
          and free cost. Comma rather than space, because several categories have a space in the
          name, such as "W3 validate".
        type: string
        default: 'W1,W2,W4'
      variants:
        description: >
          Comma separated variant letters. a is MSVC as shipped before ADR-0006, exporting every
          symbol with no /GL. b is the generated .def with /GL, which is what ships today. c is
          the same .def with /GL off, which is the only pair that isolates /GL.
        type: string
        default: 'a,b'
      repeats:
        description: >
          How many times to measure each variant. One run each cannot resolve a 3 percent
          difference, which is what #18 turned out to need.
        type: string
        default: '3'
      ada-tag:
        type: string
        default: v4.0.0

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: build ${{ inputs.rid }} variants
    # Always x64: win-arm64 cross compiles from here, and an arm64 host has no second toolset to
    # build the x64 one.
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      # TODO: pin these to full commit SHAs before the first release.
      - uses: actions/checkout@v7

      - name: build each variant
        shell: pwsh
        env:
          ADA_TAG: ${{ inputs.ada-tag }}
          VARIANTS: ${{ inputs.variants }}
          RID: ${{ inputs.rid }}
        run: |
          $ErrorActionPreference = 'Stop'

          $catalogue = [ordered]@{
              a = @{ name = 'a-msvc-allsymbols'; exports = 'all-symbols'; ipo = 'auto' }
              b = @{ name = 'b-msvc-def-gl';     exports = 'def';         ipo = 'on'   }
              c = @{ name = 'c-msvc-def-nogl';   exports = 'def';         ipo = 'off'  }
          }

          $chosen = $env:VARIANTS -split ',' | ForEach-Object { $_.Trim().ToLowerInvariant() } | Where-Object { $_ }
          $unknown = $chosen | Where-Object { -not $catalogue.Contains($_) }
          if ($unknown) { throw "unknown variant(s): $($unknown -join ', '). Known: $($catalogue.Keys -join ', ')" }

          foreach ($letter in $chosen) {
              $v = $catalogue[$letter]
              Write-Output "::group::build $($v.name)"

              Remove-Item -Recurse -Force "artifacts/native/$env:RID" -ErrorAction SilentlyContinue
              ./native/build-windows.ps1 -AdaTag $env:ADA_TAG -Rid $env:RID -Exports $v.exports -Ipo $v.ipo

              # Static checks only. They read the PE header, so they work on a cross compiled
              # binary. Running it is the measure job's problem.
              ./native/verify-windows.ps1 "artifacts/native/$env:RID"

              $stash = "variants/$($v.name)"
              New-Item -ItemType Directory -Force -Path $stash | Out-Null
              Copy-Item "artifacts/native/$env:RID/ada.dll" "$stash/ada.dll" -Force

              $size = (Get-Item "$stash/ada.dll").Length
              $sha  = (Get-FileHash "$stash/ada.dll" -Algorithm SHA256).Hash.ToLower()
              Set-Content "$stash/variant.txt" @(
                  "variant: $($v.name)"
                  "rid:     $env:RID"
                  "exports: $($v.exports)"
                  "ipo:     $($v.ipo)"
                  "ada.dll size: $size bytes"
                  "ada.dll sha256: $sha"
              )
              "built $($v.name) for $env:RID`: ada.dll $size bytes, $sha" | Out-File -Append $env:GITHUB_STEP_SUMMARY

              Write-Output '::endgroup::'
          }

      - uses: actions/upload-artifact@v7
        with:
          name: variants-${{ inputs.rid }}
          path: variants/
          retention-days: 7

  measure:
    name: measure ${{ inputs.rid }}
    needs: build
    # The binary has to run on the architecture it was built for, or the numbers are an emulator's.
    runs-on: ${{ inputs.rid == 'win-arm64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: variants-${{ inputs.rid }}
          path: variants

      # The whole suite, not just the ABI smoke test. A variant can load, answer the four symbols
      # that gate loading, and still get a setter or an IDNA path wrong, and a benchmark measures
      # a wrong answer just as happily as a right one. Stress is excluded to match ci.yml.
      #
      # This also catches the failure mode where the native does not load at all, which otherwise
      # shows up as every benchmark returning 0 immediately and reporting the same suspiciously
      # fast number.
      #
      # It runs here rather than beside the build because a cross compiled arm64 DLL cannot be
      # loaded on the x64 host that produced it.
      - name: every variant must pass conformance before anything is measured
        shell: pwsh
        env:
          RID: ${{ inputs.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $built = @(Get-ChildItem variants -Directory | Sort-Object Name)
          if ($built.Count -eq 0) { throw 'no variants were built' }

          foreach ($variant in $built) {
              Write-Output "::group::conformance $($variant.Name)"
              New-Item -ItemType Directory -Force -Path "artifacts/native/$env:RID" | Out-Null
              Copy-Item "$($variant.FullName)/ada.dll" "artifacts/native/$env:RID/ada.dll" -Force
              (Get-Item "artifacts/native/$env:RID/ada.dll").LastWriteTime = Get-Date

              dotnet test -c Release --filter-not-trait "Category=Stress"
              if ($LASTEXITCODE -ne 0) { throw "$($variant.Name): conformance failed, so its numbers mean nothing" }
              Write-Output '::endgroup::'
          }

      - name: measure, rotating through the variants
        shell: pwsh
        env:
          CATEGORIES: ${{ inputs.categories }}
          REPEATS: ${{ inputs.repeats }}
          RID: ${{ inputs.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $categories = $env:CATEGORIES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          $repeats = [int]$env:REPEATS
          if ($repeats -lt 1) { throw "repeats must be at least 1, got $repeats" }

          $built = @(Get-ChildItem variants -Directory | Sort-Object Name)
          if ($built.Count -eq 0) { throw 'no variants were built' }

          for ($round = 1; $round -le $repeats; $round++) {
              # Rotate the starting variant each round. Building once and looping was not enough
              # on its own: a fixed order leaves a always first and d always last, so drift
              # inside a round stays correlated with the variant, which is the confounder this is
              # here to remove. Rotation is deterministic, so a rerun is still reproducible.
              $offset = ($round - 1) % $built.Count
              $order = @($built[$offset..($built.Count - 1)])
              if ($offset -gt 0) { $order += $built[0..($offset - 1)] }

              Write-Output "round ${round} order: $(($order | ForEach-Object { $_.Name }) -join ', ')"

              foreach ($variant in $order) {
                  Write-Output "::group::$($variant.Name) round $round"

                  New-Item -ItemType Directory -Force -Path "artifacts/native/$env:RID" | Out-Null
                  Copy-Item "$($variant.FullName)/ada.dll" "artifacts/native/$env:RID/ada.dll" -Force

                  # Copy-Item carries the source timestamp over, and Directory.Build.targets
                  # copies the native with CopyToOutputDirectory=PreserveNewest. A stashed DLL
                  # older than the one already sitting in bin would therefore not be copied, and
                  # the round would silently measure the previous variant. Stamping it now is
                  # what makes the swap actually take.
                  (Get-Item "artifacts/native/$env:RID/ada.dll").LastWriteTime = Get-Date

                  Remove-Item -Recurse -Force BenchmarkDotNet.Artifacts -ErrorAction SilentlyContinue
                  $benchArgs = @('--anyCategories') + $categories + @('--exporters', 'json', 'markdown', '--memory')
                  dotnet run -c Release --project benchmarks/Ada.Url.Benchmarks -- @benchArgs
                  if ($LASTEXITCODE -ne 0) { throw "$($variant.Name) round ${round}: benchmark run failed" }

                  # BenchmarkDotNet exits 0 when its own validation rejects the run, so a broken
                  # harness otherwise produces a green job that measured nothing.
                  $results = @(Get-ChildItem BenchmarkDotNet.Artifacts/results -Filter *.md -ErrorAction SilentlyContinue)
                  if ($results.Count -eq 0) { throw "$($variant.Name) round ${round}: no results, check the validation output above" }

                  $dest = "out/$($variant.Name)/round-$round"
                  New-Item -ItemType Directory -Force -Path $dest | Out-Null
                  Copy-Item BenchmarkDotNet.Artifacts/results/* $dest -Recurse -Force
                  Copy-Item "$($variant.FullName)/variant.txt" "out/$($variant.Name)/variant.txt" -Force

                  "## $($variant.Name), round $round" | Out-File -Append $env:GITHUB_STEP_SUMMARY
                  foreach ($r in $results) { Get-Content $r | Out-File -Append $env:GITHUB_STEP_SUMMARY }

                  Write-Output '::endgroup::'
              }
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: win-perf-experiment-${{ inputs.rid }}
          path: out/
          retention-days: 30
