name: Bug report
description: Something in Ada.Url does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through [a private advisory](https://github.com/sanamhub/ada-csharp/security/advisories/new), not here.
        If upstream [Ada](https://github.com/ada-url/ada) gives the same wrong result, report it there instead.
  - type: textarea
    id: repro
    attributes:
      label: Code that reproduces it
      description: The smallest snippet that shows the problem, with the input URL.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: What you expected, what happened, and the full exception if there was one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ada.Url version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: Windows 11 x64, Alpine 3.20 arm64, ...
    validations:
      required: true
  - type: input
    id: dotnet
    attributes:
      label: .NET version
      description: Output of `dotnet --version`.
