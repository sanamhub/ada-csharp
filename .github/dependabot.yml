version: 2
updates:
  # Grouped so related packages move in one PR instead of conflicting on Directory.Packages.props.
  # The cooldown gives a bad release a week to be pulled before it reaches this repository.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      test:
        patterns: ["xunit.*", "Microsoft.Testing.*"]

  # Keeps the pinned action SHAs current (org section 7).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # init and analyze must share a version. Bumped apart, each PR fails the CodeQL job.
      codeql:
        patterns: ["github/codeql-action*"]
