version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keeps the pinned action SHAs current (org section 7).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # init and analyze must share a version. Bumped apart, each PR fails the CodeQL job.
      codeql:
        patterns: ["github/codeql-action*"]
